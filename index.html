<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таблица умножения</title>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --board:#2F5D4A; --frame:#8B5A2B; --chalk:#F4F7F2; --yellow:#FFE066; --pink:#FF8FAB; --mint:#8EE3B5; }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; background:#D9C7A7; display:flex; justify-content:center; align-items:flex-start;
    padding:18px 12px 40px; font-family:'Neucha','Comic Sans MS',cursive; color:var(--chalk)}
  .board{width:100%; max-width:540px; background:var(--board); border:14px solid var(--frame); border-radius:12px;
    padding:20px 18px 24px; box-shadow:0 8px 0 #6B4220, inset 0 0 60px rgba(0,0,0,.25); position:relative}
  .top{display:flex; justify-content:space-between; align-items:center; font-size:20px; margin-bottom:6px}
  .steps{display:flex; gap:5px}
  .dot{width:13px; height:13px; border-radius:50%; border:2px solid var(--chalk); opacity:.6}
  .dot.ok{background:var(--mint); opacity:1} .dot.no{background:var(--pink); opacity:1} .dot.now{background:var(--yellow); opacity:1}
  .task{text-align:center; font-size:clamp(64px,20vw,104px); line-height:1.1; margin:22px 0 26px; letter-spacing:2px}
  .task .q{color:var(--yellow)}
  .answers{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  button{font-family:'Comfortaa',sans-serif; font-weight:700; font-size:clamp(24px,7vw,32px); color:var(--board);
    background:var(--chalk); border:none; border-radius:14px; padding:16px 6px; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.3); transition:transform .08s}
  button:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.3)}
  button:focus-visible{outline:4px solid var(--yellow); outline-offset:3px}
  button.right{background:var(--mint)} button.wrong{background:var(--pink)}
  button:disabled{cursor:default}
  .note{text-align:center; font-size:24px; min-height:34px; margin:18px 0 10px}
  .next{width:100%; font-size:20px; background:var(--yellow); display:none}
  .final{text-align:center; padding:10px 0}
  .final .big{font-size:clamp(38px,11vw,56px); color:var(--yellow); margin:6px 0 8px}
  .final p{font-size:24px; margin:8px 0 20px}
  .final button{width:100%; font-size:20px; margin-top:10px}
  canvas{position:fixed; inset:0; pointer-events:none; z-index:10}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<main class="board" id="game"></main>

<script>
const TOTAL=10, NEED=8;
const g=document.getElementById('game');
let i=0, score=0, marks=[], qs=[];

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=arr=>arr.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function makeQuestions(){
  qs=[]; const used=new Set();
  while(qs.length<TOTAL){
    const a=rnd(2,9), b=rnd(2,9), key=Math.min(a,b)+'x'+Math.max(a,b);
    if(used.has(key)) continue; used.add(key);
    const r=a*b;
    // Похожие неверные ответы — частые ошибки при умножении
    const pool=shuffle([a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,r+1,r-1,r+2,r-2,r+10,r-10])
      .filter(x=>x>0 && x!==r);
    const wrong=[...new Set(pool)].slice(0,2);
    qs.push({a,b,r,opts:shuffle([r,...wrong])});
  }
}

const dots=()=>qs.map((_,k)=>`<span class="dot ${marks[k]||(k===i?'now':'')}"></span>`).join('');

function show(){
  const t=qs[i];
  g.innerHTML=`
    <div class="top"><span>Вопрос ${i+1} из ${TOTAL}</span><div class="steps">${dots()}</div></div>
    <div class="task">${t.a} × ${t.b} = <span class="q">?</span></div>
    <div class="answers">${t.opts.map(n=>`<button class="ans">${n}</button>`).join('')}</div>
    <div class="note" id="note"></div>
    <button class="next" id="next">${i<TOTAL-1?'Дальше':'Узнать результат'}</button>`;
  g.querySelectorAll('.ans').forEach(b=>b.onclick=()=>pick(b));
  document.getElementById('next').onclick=()=>{ i++; i<TOTAL?show():finish(); };
}

function pick(b){
  const t=qs[i], ok=+b.textContent===t.r;
  g.querySelectorAll('.ans').forEach(x=>{ x.disabled=true; if(+x.textContent===t.r) x.classList.add('right'); });
  if(!ok) b.classList.add('wrong'); else score++;
  marks[i]=ok?'ok':'no';
  g.querySelector('.steps').innerHTML=dots();
  g.querySelector('.q').textContent=t.r;
  document.getElementById('note').textContent=ok?'Верно! 👍':`Ошибка: ${t.a} × ${t.b} = ${t.r}`;
  const nx=document.getElementById('next'); nx.style.display='block'; nx.focus();
}

function finish(){
  const win=score>=NEED;
  g.innerHTML=`<div class="final">
    <div style="font-size:64px">${win?'🎆':'✏️'}</div>
    <div class="big">${win?'Настя, ты молодец!':'Почти получилось!'}</div>
    <p>Правильных ответов: ${score} из ${TOTAL}${win?'':`<br>Нужно хотя бы ${NEED}. Попробуй ещё раз!`}</p>
    ${win?'<button id="again2">🎵 Ещё раз музыку и салют</button>':''}
    <button id="again">Новая игра</button></div>`;
  document.getElementById('again').onclick=start;
  if(win){ celebrate(); document.getElementById('again2').onclick=celebrate; }
}

function start(){ i=0; score=0; marks=[]; makeQuestions(); show(); }

/* ---------- Музыка ---------- */
let actx;
function playTune(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99,A5=880,B5=987.77,C6=1046.5,D6=1174.66;
    const melody=[
      [C5,.5],[E5,.5],[G5,.5],[C6,1.5],[G5,.5],[C6,2],
      [A5,.5],[A5,.5],[B5,.5],[C6,.5],[D6,1],[B5,1],[G5,2],
      [E5,.5],[F5,.5],[G5,.5],[A5,.5],[G5,1],[E5,1],[F5,.5],[D5,.5],[B5,1],
      [G5,.5],[B5,.5],[D6,.5],[C6,3]
    ];
    const bass=[C5/2,C5/2,F5/4,G5/4,A5/4,F5/4,G5/4,C5/2];
    const beat=0.21, t0=actx.currentTime+0.05;
    const master=actx.createGain(); master.gain.value=0.25; master.connect(actx.destination);
    const note=(f,s,d,type,v)=>{
      const o=actx.createOscillator(), gn=actx.createGain();
      o.type=type; o.frequency.value=f;
      gn.gain.setValueAtTime(0,s); gn.gain.linearRampToValueAtTime(v,s+0.02);
      gn.gain.exponentialRampToValueAtTime(0.001,s+d);
      o.connect(gn); gn.connect(master); o.start(s); o.stop(s+d+0.05);
    };
    let total=0;
    melody.forEach(([f,d])=>{ note(f,t0+total*beat,d*beat*0.95,'triangle',0.9); total+=d; });
    const bar=total/bass.length;
    bass.forEach((f,k)=>note(f,t0+k*bar*beat,bar*beat*0.9,'sine',0.6));
  }catch(e){ console.log('Музыка недоступна',e); }
}

/* ---------- Фейерверк ---------- */
const cv=document.getElementById('fw'), cx=cv.getContext('2d');
let parts=[], rockets=[], fwUntil=0, running=false;
const colors=['#FFE066','#FF8FAB','#8EE3B5','#7CC6FE','#FFFFFF','#FFA94D'];
function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener('resize',resize); resize();

function launch(){
  rockets.push({x:rnd(cv.width*.15,cv.width*.85), y:cv.height, vy:-(rnd(9,13)), ty:rnd(cv.height*.15,cv.height*.45),
    c:colors[rnd(0,colors.length-1)]});
}
function burst(x,y,c){
  const n=60;
  for(let k=0;k<n;k++){
    const ang=Math.PI*2*k/n, sp=Math.random()*4+2;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,c:Math.random()<.3?'#fff':c});
  }
}
function frame(){
  const now=performance.now();
  if(now<fwUntil && Math.random()<0.06) launch();
  cx.globalCompositeOperation='destination-out';
  cx.fillStyle='rgba(0,0,0,0.25)'; cx.fillRect(0,0,cv.width,cv.height);
  cx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{
    r.y+=r.vy; r.vy+=0.12;
    cx.fillStyle=r.c; cx.beginPath(); cx.arc(r.x,r.y,3,0,7); cx.fill();
    if(r.y<=r.ty||r.vy>=0){ burst(r.x,r.y,r.c); return false; } return true;
  });
  parts=parts.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.vx*=0.98; p.vy*=0.98; p.life-=0.012;
    cx.globalAlpha=Math.max(p.life,0); cx.fillStyle=p.c;
    cx.beginPath(); cx.arc(p.x,p.y,2.4,0,7); cx.fill(); cx.globalAlpha=1;
    return p.life>0;
  });
  if(now<fwUntil||rockets.length||parts.length) requestAnimationFrame(frame);
  else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
}
function fireworks(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fwUntil=performance.now()+7000;
  for(let k=0;k<3;k++) setTimeout(launch,k*250);
  if(!running){ running=true; requestAnimationFrame(frame); }
}

function celebrate(){ playTune(); fireworks(); }

start();
</script>
</body>
</html>
